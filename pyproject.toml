[project]
name = "non-relational-dbs-labs"
version = "0.1.0"
description = "non-relational-dbs-labs"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "cassandra-driver>=3.29.3",
    "faker>=39.0.0",
    "faker-commerce>=1.0.4",
    "ipykernel>=7.1.0",
    "ipython-cypher>=0.2.6",
    "ipython-sql>=0.5.0",
    "ipywidgets>=8.1.8",
    "jupytext==1.19.5",
    "jupyterlab==4.6.3",
    "mimesis>=18.0.0",
    "neo4j>=6.0.3",
    "notebook==7.6.2",
    "openpyxl>=3.1.5",
    "opensearch-py==3.0.0",
    "pandas>=2.3.3",
    "papermill==2.7.0",
    "portforward>=0.7.5",
    "prettytable==3.7.0",
    "pure-sasl>=0.6.2",
    "pyarrow==25.0.1",
    "pyasyncore>=1.0.4",
    "pyhive>=0.7.0",
    "labs-runtime",
    "pymongo>=4.15.5",
    "pymysql>=1.1.2",
    "pyspark==4.1.2",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "redis>=7.1.0",
    "requests==2.32.5",
    "sparkmagic>=0.23.0",
    "sqlalchemy>=2.0.45",
    "thrift>=0.22.0",
    "thrift-sasl>=0.4.3",
    "tqdm>=4.67.1",
    "venv-pack>=0.2.0",
    "boto3>=1.40",
]

[dependency-groups]
dev = [
    "coverage==7.16.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-q", "--strict-markers", "--strict-config", "--cov", "--cov-report=term-missing"]
markers = [
    "unit: pure rules and adapters on synthetic data",
    "component: the audit applied to the real notebooks of this repository",
    "live: execute infra/lab notebooks with papermill against Docker (opt-in: LABS_LIVE=1) and check every notebook link answers HTTP 200 (opt-in: LABS_LINKS=1)",
    "e2e: the command-line audit end to end, including a negative control",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
labs-runtime = { workspace = true }

[tool.coverage.run]
branch = true
source = ["athena_gateway", "labs_runtime"]
# Measure `python -m athena_gateway` when the e2e tier runs it as a process.
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
fail_under = 100
